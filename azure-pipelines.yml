trigger:
  branches:
    include:
    - dev
    - uat

variables:
  tag: '$(Build.BuildId)'
  appName: 'order-service'
  apiName: 'OrderServiceApi.Api'
  namespace: 'default'
  dockerfilePath: 'Dockerfile'

  devEnv: 'dev'
  uatEnv: 'uat'

  acrRegistry: 'tokiacr'
  imageNameDev: 'tokiacr-order-service-dev'
  imageNameUat: 'tokiacr-order-service-uat'
  imageVersion: latest
  vmImageName: 'ubuntu-latest'
  buildConfiguration: 'Release'

stages:
- stage: BuildDev
  condition: and(always(), contains(variables['Build.SourceBranch'], 'refs/heads/dev'))
  displayName: DEV
  jobs:  
  - job: Build
    displayName: Build and Push to ACR
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and Push to ACR (Dev)
      inputs:
        command: buildAndPush
        repository: $(devEnv)/$(imageNameDev)
        dockerfile: $(Build.SourcesDirectory)/$(dockerfilePath)
        containerRegistry: 'tokiacrConnection'
        tags: |
          $(tag)
          latest
        arguments: '--build-arg ASPNETCORE_ENVIRONMENT=dev'

- stage: BuildUat
  condition: and(always(), contains(variables['Build.SourceBranch'], 'refs/heads/uat'))
  displayName: UAT
  jobs:  
  - job: Build
    displayName: Build and Push to ACR
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and Push to ACR (UAT)
      inputs:
        command: buildAndPush
        repository: $(uatEnv)/$(imageNameUat)
        dockerfile: $(Build.SourcesDirectory)/$(dockerfilePath)
        containerRegistry: 'tokiacrConnection'
        tags: |
          $(tag)
          latest
        arguments: '--build-arg ASPNETCORE_ENVIRONMENT=uat'